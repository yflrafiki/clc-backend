# Emails the admin a summary of Sunday's attendance every Sunday evening.
# Needs the CRON_SECRET repository secret (Settings > Secrets and variables > Actions),
# set to the same value as CRON_SECRET on Render.
name: Weekly attendance report

on:
  schedule:
    - cron: '0 17 * * 0'   # Sundays at 17:00 UTC
  workflow_dispatch:
    inputs:
      date:
        description: 'Report on the Sunday on or before this date (YYYY-MM-DD). Leave empty for the latest Sunday.'
        required: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send report
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REPORT_DATE: ${{ github.event.inputs.date }}
        run: |
          url="https://clc-backend-zhs6.onrender.com/api/reports/weekly-attendance/send"
          [ -n "$REPORT_DATE" ] && url="$url?date=$REPORT_DATE"
          # The free Render server may be asleep, so allow time to wake and retry
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o response.json -w '%{http_code}' -m 90 -X POST -H "x-cron-secret: $CRON_SECRET" "$url" || echo 000)
            cat response.json 2>/dev/null; echo
            [ "$code" = "200" ] && exit 0
            [ "$code" = "401" ] && { echo "CRON_SECRET does not match Render"; exit 1; }
            echo "Attempt $attempt got $code, retrying in 30s"
            sleep 30
          done
          exit 1
